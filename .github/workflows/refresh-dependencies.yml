name: Refresh dependency lockfile

on:
  push:
    branches:
      - "feat/actual-certificate-preview"
    paths:
      - "package.json"
      - ".github/workflows/refresh-dependencies.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/actual-certificate-preview

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile and apply non-breaking security updates
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only || true

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: refresh dependency lockfile"
            git push origin HEAD:feat/actual-certificate-preview
          fi
